<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Asset Scanner</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#24354a;font:16px system-ui}header{background:#174575;color:white;padding:20px;font-size:23px;font-weight:700}main{max-width:650px;margin:auto;padding:16px}section{background:white;border-radius:14px;padding:18px;margin-bottom:16px}label{display:block;margin:14px 0 6px;font-weight:600}input,select,button{font:inherit;border-radius:8px;padding:12px}input,select{width:100%;border:1px solid #aab8ca;background:white;color:#24354a;min-width:0}button{border:0;background:#174575;color:white;cursor:pointer}button.secondary{background:#e5edf7;color:#174575} .line{display:flex;gap:8px}.line input{flex:1} .wide{width:100%;margin-top:16px}video{width:100%;max-height:300px;background:#111;border-radius:8px}#camera[hidden]{display:none}#message{overflow-wrap:anywhere}article{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}small{color:#536579}</style></head><body><header>IT Asset Scanner</header><main><section id="camera" hidden><video id="video" playsinline muted></video><button class="secondary wide" id="stop">Cancel scan</button></section><section><form id="form"><label for="tag">Asset Tag</label><div class="line"><input id="tag" required autocomplete="off"><button type="button" data-scan="tag">Scan</button></div><label for="serial">Serial Number</label><div class="line"><input id="serial" autocomplete="off"><button type="button" data-scan="serial">Scan</button></div><label for="device">Device Type</label><select id="device" required><option value="">Select device type</option><option>Laptop</option><option>Desktop</option><option>Monitor</option><option>iPhone</option><option>iPad</option><option>Android Phone</option><option>Docking Station</option><option>Printer</option><option>Server</option><option>Network Switch</option><option>Router</option><option>Firewall</option><option>Access Point</option><option>Headset</option><option>Keyboard</option><option>Mouse</option><option>Other</option></select><label for="manufacturer">Manufacturer</label><input id="manufacturer" placeholder="Dell"><label for="model">Model</label><select id="model"><option value="">Select model</option></select><input id="customModel" placeholder="Enter model" hidden style="margin-top:8px"><label for="assigned">Assigned User</label><input id="assigned"><label for="location">Location</label><input id="location" placeholder="Tokyo Office"><label for="status">Status</label><select id="status"><option>In Use</option><option>In Stock</option><option>Under Repair</option><option>Retired</option></select><button class="wide">Save Asset</button></form><p id="message" role="status"></p></section><section><h2>Saved assets (<span id="count">0</span>)</h2><input id="search" placeholder="Search assets" aria-label="Search assets"><button id="export" class="wide">Export CSV</button><div id="records"></div><small>Records stay in this browser. Export backups regularly. Prototype: use dummy data only.</small></section></main><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script>
const $=id=>document.getElementById(id), fields=['tag','serial','device','manufacturer','model','assigned','location','status'], key='it-assets-v1';let records=[], controls=null, generation=0;try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))records=[]}catch(e){$('message').textContent='Could not read saved records.'}const msg=s=>$('message').textContent=s;
const models={Laptop:['Dell Latitude 5420','Dell Latitude 5430','Dell Latitude 5440','Dell Latitude 5450','Dell Latitude 5550','Dell Latitude 7450','Dell Precision','Lenovo ThinkPad T14','Lenovo ThinkPad X1 Carbon','HP EliteBook 840','MacBook Air','MacBook Pro'],Desktop:['Dell OptiPlex','Dell Precision','HP EliteDesk','Lenovo ThinkCentre','Mac mini','iMac'],Monitor:['Dell P2422H','Dell P2425H','Dell P2722H','Dell U2723QE','HP E24','Lenovo ThinkVision'],iPhone:['iPhone 12','iPhone 13','iPhone 14','iPhone 15','iPhone 16','iPhone 17','iPhone SE'],iPad:['iPad','iPad Air','iPad Pro','iPad mini'],'Docking Station':['Dell WD19','Dell WD19S','Dell WD22TB4','Lenovo ThinkPad USB-C Dock','HP USB-C Dock']};
function updateModels(){const m=$('model');m.replaceChildren(new Option('Select model',''),...(models[$('device').value]||[]).map(v=>new Option(v,v)),new Option('Other / Enter manually','__other__'));$('customModel').hidden=true;$('customModel').value='';$('customModel').required=false;}
$('device').addEventListener('change',updateModels);$('model').addEventListener('change',()=>{const other=$('model').value==='__other__';$('customModel').hidden=!other;$('customModel').required=other;});updateModels();
function stop(){generation++;if(controls){controls.stop();controls=null}const v=$('video');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}$('camera').hidden=true}
async function scan(field){stop();const token=generation; if(!window.ZXingBrowser){msg('Scanner library unavailable. Check internet access.');return}if(!navigator.mediaDevices?.getUserMedia){msg('Camera requires HTTPS and permission.');return}$('camera').hidden=false;$('camera').scrollIntoView({behavior:'smooth'});msg('Point the camera at the barcode.');try{const reader=new ZXingBrowser.BrowserMultiFormatReader();let found=false;const c=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'}}},$('video'),(result,error,ctl)=>{if(result&&!found&&token===generation){found=true;$(field).value=result.getText();ctl.stop();stop();msg('Barcode captured.')}});if(token!==generation||found)c.stop();else controls=c}catch(e){if(token===generation){stop();msg('Camera error: '+e.message)}}}
document.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>scan(b.dataset.scan));$('stop').onclick=stop;window.addEventListener('pagehide',stop);
function render(){$('count').textContent=records.length;$('records').replaceChildren();const q=$('search').value.toLowerCase();records.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)).forEach(r=>{const a=document.createElement('article'),b=document.createElement('strong'),p=document.createElement('p');b.textContent=r.tag+' — '+r.serial;p.textContent=[r.device,r.manufacturer,r.model,r.assigned,r.location,r.status,r.date].filter(Boolean).join(' | ');a.append(b,p);$('records').append(a)})}
$('form').onsubmit=e=>{e.preventDefault();const r=Object.fromEntries(fields.map(f=>[f,$(f).value.trim()]));if(r.model==='__other__')r.model=$('customModel').value.trim();if(!r.tag){msg('Enter an asset tag.');return}if(records.some(x=>x.tag.toLowerCase()===r.tag.toLowerCase())){msg('Duplicate asset tag. Record not saved.');return}r.date=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify([...records,r]));records.push(r);render();$('form').reset();updateModels();msg('Asset saved on this device.')}catch(e){msg('Storage unavailable. Asset not saved.')}};$('search').oninput=render;
$('export').onclick=()=>{if(!records.length){msg('No records to export.');return}const quote=v=>'"'+String(v??'').replace(/^[\s]*[=+\-@]/,m=>"'"+m).replace(/"/g,'""')+'"';const csv=[['Asset Tag','Serial Number','Device Type','Manufacturer','Model','Assigned User','Location','Status','Scan Date'].map(quote).join(','),...records.map(r=>[...fields.map(f=>r[f]),r.date].map(quote).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='IT_Assets.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};render();</script></body></html>
